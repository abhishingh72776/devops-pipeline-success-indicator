
name: DevOps Pipeline Indicator

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deployment
  cancel-in-progress: true

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Project Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All project files found."

      - name: Validate JavaScript
        run: |
          node --check script.js
          echo "JavaScript syntax is valid."

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Get Source Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running application validation..."
          test -s index.html
          test -s style.css
          test -s script.js
          node --check script.js
          echo "All validation checks passed."

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get Source Code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Report Pipeline Result to AWS
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always()

    steps:
      - name: Prepare Pipeline Result
        id: result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          echo "Build result: $BUILD_RESULT"
          echo "Test result: $TEST_RESULT"
          echo "Deploy result: $DEPLOY_RESULT"

          if [[ "$BUILD_RESULT" == "failure" || "$TEST_RESULT" == "failure" || "$DEPLOY_RESULT" == "failure" ]]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_RESULT" == "cancelled" || "$TEST_RESULT" == "cancelled" || "$DEPLOY_RESULT" == "cancelled" ]]; then
            echo "conclusion=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Result to AWS
        shell: bash
        env:
          WEBHOOK_SECRET: ${{ secrets.AWS_PIPELINE_WEBHOOK_SECRET }}
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg run_id "$RUN_ID" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH" \
            --arg status "completed" \
            --arg conclusion "$CONCLUSION" \
            --arg commit "$COMMIT" \
            --arg url "$RUN_URL" \
            '{
              run_id: $run_id,
              workflow: $workflow,
              branch: $branch,
              status: $status,
              conclusion: $conclusion,
              commit: $commit,
              url: $url
            }' > payload.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            "https://8igfpsu19h.execute-api.us-east-1.amazonaws.com/default/DevOpsPipelineEventProcessor" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            --data-binary @payload.json
